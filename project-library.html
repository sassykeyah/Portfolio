<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Project Library - Saskia Day Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://use.typekit.net/sep3hls.css">

    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
    <script src="projects.js"></script>
    <script src="script.js"></script>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header class="header">
        <div class="name">Saskia Day</div>
        <nav class="nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="project-library.html" aria-current="page">Project Library</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main id="main-content">
        <section class="library-intro" aria-label="Project library introduction">
            <p>A collection of my work across digital experiences and graphic design. Filter by type to focus on what you're after.</p>
        </section>

        <div class="library-filter" role="group" aria-label="Filter projects by type">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="web" aria-pressed="false">Web / UX</button>
            <button type="button" data-filter="graphic" aria-pressed="false">Graphic Design</button>
        </div>

        <section class="library-grid" id="project-library-grid" aria-label="Project grid" aria-live="polite">
            <!-- Cards rendered by script.js from projects.js -->
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <nav class="footer-nav" aria-label="Footer navigation">
                <a href="index.html">Home</a>
                <a href="project-library.html">Project Library</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="footer-info">
                <p>&copy; 2025 Saskia Day. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>

</html>
